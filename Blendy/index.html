<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blendy — Real fruit smoothies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Poppins:wght@500;600;700&family=Unbounded:wght@500&display=swap" rel="stylesheet">
<style>
/* VOICE: playful, fresh, product-led smoothie hero
   IDEA: a shelf of flavours you flip through; each one rises into frame in a hand and bursts
   PICTURE: keyed hand-held cup that bursts into a fruit splash, giant white word behind
   COLOUR and TYPE: each backdrop is the smoothie's own colour, sampled from its cup; pure white text; Poppins 500/600/700, Baloo 2 800 logo
   LAYOUT: 1440x900 design frame scaled by --u, UI pinned to edges in --n units */
:root{--u:1px;--fy:0px;--n:clamp(.5px,min(100vw / 1440,100vh / 900),1.3px);--ts:0 1px 6px rgba(90,70,40,.18);--ln:cubic-bezier(.65,0,.35,1)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#FCA300;color:#fff;font-family:Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;touch-action:pan-y}

#stage{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none}
.slide{position:absolute;inset:0;overflow:hidden;visibility:hidden}
.slide.on{visibility:visible;z-index:2}
.water{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:soft-light;opacity:var(--water-o,.5);pointer-events:none}
.frame{position:absolute;width:calc(var(--u)*1440);height:calc(var(--u)*900);left:calc(50% - var(--u)*720);top:calc(50% - var(--u)*450 + var(--fy))}
.boot .frame{visibility:hidden}
.layer{position:absolute;inset:0;will-change:transform}
.w{position:absolute;left:0;width:100%;text-align:center;font-weight:700;line-height:1;white-space:nowrap;color:#fff;overflow:hidden;padding:.14em 0 .3em}
.l{display:inline-block;will-change:transform}
.p{position:absolute;background-repeat:no-repeat}
.pc{position:absolute;inset:0;background-repeat:no-repeat;background-size:100% 100%;transform:rotate(var(--r));animation:bob var(--d) ease-in-out var(--dl) infinite alternate}
.corner .p{filter:blur(calc(var(--u)*9))}
.hand{position:absolute;display:block;pointer-events:none;transform-origin:50% 100%}
@keyframes bob{from{transform:translateY(calc(var(--u)*-7)) rotate(calc(var(--r) - 3deg))}to{transform:translateY(calc(var(--u)*7)) rotate(calc(var(--r) + 3deg))}}

.ui{position:fixed;inset:0;z-index:10;pointer-events:none;text-shadow:var(--ts)}
:where(.ui) a,:where(.ui) button{pointer-events:auto;background:none;border:0;padding:0;margin:0;color:#fff;font:inherit;text-decoration:none;cursor:pointer;text-shadow:inherit;-webkit-tap-highlight-color:transparent}
.ui :focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:4px}
header{position:absolute;left:calc(var(--n)*50);right:calc(var(--n)*50);top:calc(var(--n)*26);height:calc(var(--n)*50);display:flex;align-items:center}
.logo{font-family:"Baloo 2",Poppins,system-ui,sans-serif;font-weight:800;font-size:calc(var(--n)*51);letter-spacing:-.02em;line-height:1}
/* menu and buttons: rounded pills in Unbounded, as on yaas-energy.com (whose own font, Bounded, is a near twin) */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:max(34px,calc(var(--n)*44));
  padding:calc(var(--n)*8) calc(var(--n)*20);border-radius:100px;border:1px solid #fff;background:rgba(217,217,217,.05);
  font-family:Unbounded,Poppins,system-ui,sans-serif;font-weight:500;font-size:clamp(12px,calc(var(--n)*16),19px);
  letter-spacing:-.2px;line-height:1.2;white-space:nowrap;transition:background .2s,border-color .2s,color .2s}
:where(.ui) .pill:hover,.tabs .pill[aria-current=true]{background:#fff;color:#212121;text-shadow:none}
.tabs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:calc(var(--n)*15)}
.line{display:none}
.acct{margin-left:auto;display:flex;align-items:center;gap:calc(var(--n)*15)}
/* main call to action: larger than the menu pills, centred on the same line as the arrows */
.shop{position:absolute;left:50%;bottom:calc(var(--n)*24);transform:translateX(-50%) translate3d(var(--mx,0px),var(--my,0px),0) scale(var(--ms,1));overflow:hidden;isolation:isolate;transition:transform .55s cubic-bezier(.2,.8,.2,1),color .35s,background .2s,border-color .2s;background:#fff;color:#212121 !important;text-shadow:none !important;font-size:clamp(15px,calc(var(--n)*21),26px);min-height:max(50px,calc(var(--n)*64));padding:calc(var(--n)*16) calc(var(--n)*42);gap:12px;box-shadow:0 8px 28px rgba(60,30,20,.18)}
/* motion layer: letter roll, magnetic pull, colour fill, arrow swap, landing shine */
.roll{display:inline-flex;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.rc{display:inline-block;overflow:hidden;height:1.28em;line-height:1.28}
.rc>span{display:block;transition:transform .5s cubic-bezier(.7,0,.2,1);transition-delay:calc(var(--i)*22ms)}
.pill:hover .rc>span,.pill:focus-visible .rc>span{transform:translateY(-100%)}
.shop .roll{transform:translate3d(calc(var(--mx,0px)*.35),calc(var(--my,0px)*.35),0)}
.shop:active{--ms:.95}
.shop-fill{position:absolute;left:var(--fx,50%);top:var(--fy,50%);width:var(--fd,400px);height:var(--fd,400px);margin:calc(var(--fd,400px)/-2) 0 0 calc(var(--fd,400px)/-2);
  border-radius:50%;background:var(--accent,#212121);transform:scale(0);transition:transform .6s cubic-bezier(.2,.8,.2,1);z-index:-1;pointer-events:none}
.shop.is-hot{color:#fff !important}
.shop.is-hot .shop-fill{transform:scale(1)}
.shop-arrow{display:inline-grid;overflow:hidden;width:1em;height:1em}
.shop-arrow svg{grid-area:1/1;width:100%;height:100%;transition:transform .5s cubic-bezier(.7,0,.2,1)}
.shop-arrow svg+svg{transform:translateX(-130%)}
.shop.is-hot .shop-arrow svg{transform:translateX(130%)}
.shop.is-hot .shop-arrow svg+svg{transform:translateX(0);transition-delay:.06s}
.shop::after{content:"";position:absolute;inset:-2px;z-index:1;pointer-events:none;opacity:0;
  background:linear-gradient(105deg,transparent 30%,var(--accent,#fca300) 50%,transparent 70%);transform:translateX(-110%)}
.shop.shine::after{animation:shine 1.15s cubic-bezier(.45,0,.2,1)}
@keyframes shine{0%{opacity:.45;transform:translateX(-110%)}100%{opacity:.45;transform:translateX(110%)}}
.arr{transform:translate3d(var(--mx,0px),var(--my,0px),0);transition:transform .55s cubic-bezier(.2,.8,.2,1),background .2s,color .2s}
.arr svg{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.prev:hover svg{transform:translateX(-4px)}.next:hover svg{transform:translateX(4px)}
.arr:active{transform:translate3d(var(--mx,0px),var(--my,0px),0) scale(.92)}
.arr{position:absolute;bottom:calc(var(--n)*32);width:max(38px,calc(var(--n)*48));height:max(38px,calc(var(--n)*48));padding:0;min-height:0;color:#fff}
.arr svg{width:max(16px,calc(var(--n)*20));height:max(16px,calc(var(--n)*20))}
.prev{left:calc(var(--n)*36)}.next{right:calc(var(--n)*36)}
/* studio credit, reading up the right edge */
.credit{position:absolute;right:calc(var(--n)*22);top:50%;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;
  font-family:Unbounded,Poppins,system-ui,sans-serif;font-weight:500;font-size:clamp(10px,calc(var(--n)*12),13px);letter-spacing:.06em;opacity:.85;
  padding:8px 4px;transition:opacity .2s}
.credit:hover{opacity:1;text-decoration:underline;text-underline-offset:4px}
.rise{opacity:0;translate:0 14px}

@media (max-width:820px),(orientation:portrait){
  :root{--n:1px}
  header{left:20px;right:20px;top:16px;height:40px}
  .logo{font-size:34px}
  .acct{gap:8px}
  .acct .pill{font-size:12px;min-height:36px;padding:6px 12px}
  .tabs{top:52px;transform:translateX(-50%);gap:8px}
  .tabs .pill{font-size:13px;min-height:40px;padding:8px 14px}
  .shop{font-size:17px;min-height:54px;bottom:13px;padding:12px 32px}
  .arr{width:44px;height:44px;bottom:18px}
  .arr svg{width:18px;height:18px}
  .prev{left:12px}.next{right:12px}
  .credit{right:4px;font-size:10px}
}
@media (prefers-reduced-motion:reduce){
  .pc{animation:none}
  .line{transition:none}
  .rc>span,.shop-fill,.shop-arrow svg,.roll,.arr svg{transition:none}
  .shop.shine::after{animation:none}
}
</style>
</head>
<body class="boot">
<main id="stage" aria-label="Blendy flavours"></main>

<div class="ui">
  <header>
    <a class="logo rise" href="#">Blendy</a>
    <nav class="tabs rise" aria-label="Flavours">
      <button type="button" class="pill">Mango</button>
      <button type="button" class="pill">Berry</button>
      <button type="button" class="pill">Kiwi</button>
      <i class="line" aria-hidden="true"></i>
    </nav>
    <div class="acct rise"><a class="pill" href="#">Cart</a><a class="pill" href="#">Register</a></div>
  </header>
  <button type="button" class="pill arr prev rise" aria-label="Previous flavour"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 14H4M12 6l-8 8 8 8"/></svg></button>
  <a class="pill shop rise" href="#" aria-label="Order now"><span class="shop-fill" aria-hidden="true"></span><span class="roll" data-roll="Order now"></span><span class="shop-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
  <a class="credit rise" href="https://internetdesign.sg" target="_blank" rel="noopener">internetdesign.sg 2026</a>
  <button type="button" class="pill arr next rise" aria-label="Next flavour"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h20M16 6l8 8-8 8"/></svg></button>
</div>

<script>
{
// bg: the smoothie colour sampled from the cup in its clip
// each flavour: its own hand-held cup clip (keyed live) and a reversed copy for the rewind.
// start: where playback begins as the hand rises; end: where the splash stops moving
const CLIP={frames:121,fps:24,x:388,y:50,w:675,h:900};
// floating fruit (cut-outs in assets/images/fruit/): [image, x, y, w, rotation, mirror, blurred corner piece]
const FRUIT_AR={'mango-cheek':.8063,'kiwi-half':.9792,'kiwi-wedge-a':.8521,'kiwi-wedge-b':.9442,'kiwi-wedge-c':.7625,
  'berry-strawberry':1.0976,'berry-strawberry-half':1.1675,'berry-raspberry':.9912,'berry-blackberry':1.0471,
  'berry-blueberry':.9408,'berry-blueberry-b':.9264};
const F=[
 {name:'Mango',bg:'#FCA300',clip:{src:'assets/video/mango.mp4',rev:'assets/video/mango-rev.mp4',start:.85,end:4.25},
  fruit:[['mango-cheek',230,150,170,-18,0,0],['mango-cheek',395,480,120,24,1,0],['mango-cheek',1105,170,160,14,1,0],
         ['mango-cheek',1195,455,135,-30,0,0],['mango-cheek',1005,615,110,38,1,0],
         ['mango-cheek',-30,600,270,12,0,1],['mango-cheek',1255,40,230,-16,1,1]]},
 {name:'Berry',bg:'#BC1540',clip:{src:'assets/video/berry.mp4',rev:'assets/video/berry-rev.mp4',start:.85,end:4.2},
  fruit:[['berry-strawberry',225,140,145,-14,0,0],['berry-blueberry',400,485,95,0,0,0],['berry-strawberry-half',1110,160,130,16,0,0],
         ['berry-raspberry',1190,465,120,18,0,0],['berry-blackberry',1012,615,100,-10,0,0],
         ['berry-strawberry',-25,580,240,22,0,1],['berry-blueberry-b',1265,45,195,0,0,1]]},
 {name:'Kiwi',bg:'#99B901',clip:{src:'assets/video/kiwi.mp4',rev:'assets/video/kiwi-rev.mp4',start:0,end:3.55},
  fruit:[['kiwi-wedge-a',225,150,165,-10,0,0],['kiwi-half',390,470,130,-12,0,0],['kiwi-wedge-b',1110,175,140,12,0,0],
         ['kiwi-wedge-c',1185,460,160,-8,0,0],['kiwi-wedge-a',1000,615,120,30,1,0],
         ['kiwi-half',-30,585,270,8,0,1],['kiwi-wedge-c',1255,45,230,20,1,1]]}
];
const FACT=[.40,.30,.15,.55,.75];
const COVER=[[0,0],[.031,.006],[.134,.012],[.206,.023],[.278,.047],[.34,.07],[.412,.105],[.485,.158],[.546,.246],[.583,.55],[.62,.825],[.69,.9],[.79,.94],[.85,.956],[.93,.975],[1,1]];
const EZ='cubic-bezier(0.22, 0.8, 0.3, 1)';

const root=document.documentElement, stage=document.getElementById('stage');
const mqM=matchMedia('(max-width:820px),(orientation:portrait)');
const mqR=matchMedia('(prefers-reduced-motion: reduce)');
const r3=n=>Math.round(n*1000)/1000;
const U=n=>`calc(var(--u)*${r3(n)})`;
const clamp=v=>Math.max(0,Math.min(1,v));
const eoq=k=>1-(1-k)*(1-k);
const rnd=()=>`--d:${(3.2+Math.random()*1.8).toFixed(2)}s;--dl:${(-Math.random()*4).toFixed(2)}s`;
function cover(t){
  if(t<=0)return 0; if(t>=1)return 1;
  let i=1; while(COVER[i][0]<t)i++;
  const [t0,c0]=COVER[i-1],[t1,c1]=COVER[i],k=(t-t0)/(t1-t0);
  return c0+(c1-c0)*(3*k*k-2*k*k*k);
}

const esc=t=>t.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
stage.innerHTML=F.map(f=>{
  const pcs=blur=>f.fruit.filter(p=>p[6]===blur).map(([img,x,y,w,r,m])=>`<div class="p" style="left:${U(x)};top:${U(y)};width:${U(w)};height:${U(w*FRUIT_AR[img])}${m?';transform:scaleX(-1)':''}"><div class="pc" style="background-image:url(assets/images/fruit/${img}.webp);--r:${r}deg;${rnd()}"></div></div>`).join('');
  // the word is split into letters inside a mask, for the letter drop between flavours
  const word=[...f.name].map(ch=>`<span class="l">${esc(ch)}</span>`).join('');
  return `<section class="slide" aria-label="${f.name}" style="background:${f.bg}"><video class="water" muted loop playsinline preload="auto" aria-hidden="true"></video><div class="frame">`+
    `<div class="layer word"><div class="w" aria-label="${f.name}"><span class="ls" aria-hidden="true">${word}</span></div></div>`+
    `<div class="layer shadow"></div>`+
    `<div class="layer bottle" role="img" aria-label="A hand holds up a ${f.name.toLowerCase()} smoothie that bursts into a splash of fruit"><canvas class="hand"></canvas></div>`+
    `<div class="layer fruit">${pcs(0)}</div><div class="layer corner">${pcs(1)}</div></div></section>`;
}).join('');
const slides=[...stage.querySelectorAll('.slide')];
const layers=s=>[...s.querySelectorAll('.layer')];
const tabs=[...document.querySelectorAll('.tabs button')];
const line=document.querySelector('.line');
let u=1, cur=0, busy=false, lastAct=0, revealed=false;

/* ---------- water ripples over each backdrop ---------- */
// one greyscale, seamlessly looping clip, blended (soft-light) into the flavour colour behind everything else;
// only the visible slide's copy plays
const waters=slides.map(s=>s.querySelector('.water'));
const playWater=i=>{if(!mqR.matches)waters[i].play().catch(()=>{});};
fetch('assets/video/water.mp4').then(r=>{if(!r.ok)throw 0;return r.blob();}).then(b=>URL.createObjectURL(b)).catch(()=>'assets/video/water.mp4')
  .then(src=>{waters.forEach(w=>{w.muted=true;w.src=src;});playWater(cur);});
slides[0].classList.add('on');

/* ---------- hand clips, sky keyed out live, one canvas per slide ---------- */
const SPLASH_DELAY=300; // ms after the hand starts rising before the splash plays
let splashTimer=0;
// the tail of each splash eases into slow motion while the hand drifts a touch closer;
// when it stops moving, the slider moves straight on to the next flavour
const SLOW_SPAN=2.25, SLOW_TO=.45, DRIFT_MS=3300;
let drifting=false;
const REWIND_RATE=4; // the outgoing splash rewinds into the cup at 4x
// key: bluish AND bright is sky; dark blues (blueberries) stay
const KEY_LO=8/255, KEY_W=30/255, KEY_B0=150/255, KEY_BW=40/255;
function makeVideo(src){
  const v=document.createElement('video');
  v.muted=true; v.defaultMuted=true; v.playsInline=true; v.preload='auto';
  v.setAttribute('muted',''); v.setAttribute('playsinline',''); v.setAttribute('aria-hidden','true');
  // load into memory so seeking works whatever the server supports; fall back to the plain URL
  fetch(src).then(r=>{if(!r.ok)throw 0;return r.blob();}).then(bl=>{v.src=URL.createObjectURL(bl);}).catch(()=>{v.src=src;});
  Object.assign(v.style,{position:'fixed',left:'0',top:'0',width:'2px',height:'2px',opacity:'0',pointerEvents:'none'});
  document.body.appendChild(v);
  return v;
}
const clips=F.map((f,i)=>{
  const c={...f.clip,i,fw:makeVideo(f.clip.src),rv:makeVideo(f.clip.rev),failed:false,revFailed:false};
  c.slowFrom=Math.max(c.start+.9,c.end-SLOW_SPAN);
  c.fw.addEventListener('seeked',()=>{if(cur===i)need=true;});
  c.fw.addEventListener('ended',()=>{if(cur===i)finishSplash();});
  c.fw.addEventListener('error',()=>{c.failed=true;if(cur===i)ended=Date.now();});
  c.fw.addEventListener('loadedmetadata',()=>{if(i===0)sizeHand();});
  c.rv.addEventListener('error',()=>{c.revFailed=true;});
  c.rv.addEventListener('seeked',()=>{
    if(exitIdx!==i||revReady)return;
    revReady=true; lastR=-1;
    c.rv.playbackRate=REWIND_RATE; c.rv.play().catch(()=>{});
  });
  return c;
});
const V=()=>clips[cur].fw;
let exitIdx=-1, revReady=false, revEnd=0, lastR=-1;
const canvases=slides.map(s=>s.querySelector('.hand'));
let ext=0, need=true, lastT=-1, ended=0, entered=0;
function renderer(cvs){
  const gl=cvs.getContext('webgl',{premultipliedAlpha:true,alpha:true,antialias:false,preserveDrawingBuffer:true});
  if(!gl){
    const c2=cvs.getContext('2d',{willReadFrequently:true}); cvs.dataset.lo='1';
    return src=>{
      const W=cvs.width,H=cvs.height,vh=Math.round(H*CLIP.h/(CLIP.h+ext));
      c2.clearRect(0,0,W,H); c2.drawImage(src,0,0,W,vh);
      if(H>vh)c2.drawImage(src,0,src.videoHeight-1,src.videoWidth,1,0,vh-1,W,H-vh+1);
      const im=c2.getImageData(0,0,W,H),d=im.data;
      for(let i=0;i<d.length;i+=4){const m=Math.max(d[i],d[i+1]),k=d[i+2]-m;if(k>8&&d[i+2]>150){const a=1-clamp((k-8)/30)*clamp((d[i+2]-150)/40);d[i+2]=Math.min(d[i+2],m);d[i+3]=a*255;}}
      c2.putImageData(im,0,0);
    };
  }
  const sh=(type,src)=>{const o=gl.createShader(type);gl.shaderSource(o,src);gl.compileShader(o);return o;};
  const pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 p;varying vec2 v;void main(){v=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}'));
  // edge pixels that touch the sky are faded and lose their blue tint, so no rim shows on the backdrop
  gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,`precision mediump float;varying vec2 v;uniform sampler2D t;uniform float sy;
const vec2 px=vec2(1./834.,1./1112.);
float key(vec3 c){float d=c.b-max(c.r,c.g);
return clamp((d-${KEY_LO.toFixed(4)})/${KEY_W.toFixed(4)},0.,1.)*clamp((c.b-${KEY_B0.toFixed(4)})/${KEY_BW.toFixed(4)},0.,1.);}
void main(){vec2 uv=vec2(v.x,min(v.y*sy,.999));vec3 c=texture2D(t,uv).rgb;float k=key(c);
float kn=max(max(key(texture2D(t,uv+vec2(px.x,0.)).rgb),key(texture2D(t,uv-vec2(px.x,0.)).rgb)),
             max(key(texture2D(t,uv+vec2(0.,px.y)).rgb),key(texture2D(t,uv-vec2(0.,px.y)).rgb)));
float a=(1.-k)*(1.-.8*kn);if(k+kn>0.)c.b=min(c.b,max(c.r,c.g));gl_FragColor=vec4(c*a,a);}`));
  gl.linkProgram(pr); gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  gl.bindTexture(gl.TEXTURE_2D,gl.createTexture());
  [[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]].forEach(([k,val])=>gl.texParameteri(gl.TEXTURE_2D,k,val));
  const uSy=gl.getUniformLocation(pr,'sy');
  return src=>{
    gl.viewport(0,0,cvs.width,cvs.height);
    gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
    gl.uniform1f(uSy,(CLIP.h+ext)/CLIP.h);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  };
}
const draws=canvases.map(renderer);
// the arm is cut at the clip's bottom edge, so it must reach the viewport bottom:
// grow the clip a little, then lower it a little, and only stretch the last row for what is left
let handTop=0;
function sizeHand(){
  const H=innerHeight, frameTop=H/2-450*u+(mqM.matches?8:0);
  const gap=Math.max(0,(H-(frameTop+(CLIP.y+CLIP.h)*u))/u+40); // the arm always runs past the screen's bottom edge
  const s=Math.min(1+gap/CLIP.h,1.22), shift=Math.min(gap-(s-1)*CLIP.h,140);
  ext=Math.max(0,gap-(s-1)*CLIP.h-shift)/s;
  const w=CLIP.w*s, h=CLIP.h*s, cx=CLIP.x+CLIP.w*.4916;
  handTop=frameTop+(CLIP.y+shift)*u;
  const v=clips[0].fw, vw=v.videoWidth||834, vh=v.videoHeight||1112;
  canvases.forEach(c=>{
    Object.assign(c.style,{left:U(cx-w*.4916),top:U(CLIP.y+shift),width:U(w),height:U(h+ext*s)});
    const sc=c.dataset.lo?.5:1;
    c.width=Math.round(vw*sc); c.height=Math.round(vh*sc*(CLIP.h+ext)/CLIP.h);
  });
  need=true;
}
// distance that puts the whole hand below the viewport
const dropY=()=>innerHeight-handTop+8;
function loop(){
  const c=clips[cur], v=c.fw;
  if(v.readyState>=2&&(need||v.currentTime!==lastT)){
    try{draws[cur](v);}catch(e){}
    lastT=v.currentTime; need=false;
  }
  if(!v.paused&&!mqR.matches&&v.duration){
    if(v.currentTime>=c.end)finishSplash();
    const p=clamp((v.currentTime-c.slowFrom)/(c.end-c.slowFrom)), r=1-(1-SLOW_TO)*p*p*(3-2*p);
    if(Math.abs(v.playbackRate-r)>.01)v.playbackRate=r;
    if(p>0&&!drifting){
      drifting=true;
      canvases[cur].animate([{transform:'scale(1)'},{transform:'scale(1.04)'}],{duration:DRIFT_MS,easing:'cubic-bezier(.25,.6,.4,1)',fill:'forwards'});
    }
  }
  if(exitIdx>=0&&revReady){
    const rv=clips[exitIdx].rv;
    if(rv.readyState>=2&&rv.currentTime!==lastR){
      try{draws[exitIdx](rv);}catch(e){}
      lastR=rv.currentTime;
      if(rv.currentTime>=revEnd)rv.pause();
    }
  }
  requestAnimationFrame(loop);
}
function enterHand(){
  const c=clips[cur], v=c.fw;
  clips.forEach(o=>{if(o!==c)o.fw.pause();});
  v.pause(); v.playbackRate=1; ended=0; entered=Date.now(); drifting=false;
  canvases[cur].getAnimations().forEach(a=>a.cancel());
  try{v.currentTime=mqR.matches?c.end:c.start;}catch(e){}
  need=true;
}
function landHand(){
  shine();
  const c=clips[cur];
  if(mqR.matches||c.failed){ended=Date.now();return;}
  c.fw.play().catch(()=>{ended=Date.now();});
}
// the moment the splash stops moving, go straight to the next flavour
function finishSplash(){
  if(ended)return;
  ended=Date.now(); V().pause();
  if(revealed&&!busy&&!document.hidden)next();
}
const videoReady=new Promise(res=>{
  const v=clips[0].fw;
  if(v.readyState>=2)res();
  v.addEventListener('loadeddata',res,{once:true});
  v.addEventListener('error',res,{once:true});
});
requestAnimationFrame(loop);

/* ---------- words ---------- */
const cv=document.createElement('canvas').getContext('2d');
function sizeWords(){
  const mob=mqM.matches;
  const target=mob?Math.min(1440,innerWidth/u)*.92:1400;
  const thresh=mob?target*1330/1400:1330;
  cv.font='700 100px Poppins';
  slides.forEach((s,i)=>{
    const el=s.querySelector('.w'), t=F[i].name, m=cv.measureText(t);
    const ink=(m.actualBoundingBoxLeft+m.actualBoundingBoxRight)/100, gaps=t.length-1;
    let ls=.005, sz=445;
    if(ink*sz+ls*sz*gaps>thresh){ls=-.035; sz=Math.min(445,target/(ink+ls*gaps));}
    el.style.fontSize=U(sz);
    el.style.letterSpacing=ls+'em';
    el.style.textIndent=ls+'em';
    el.style.top=U(403.5+.698*sz/2-.85*sz-.14*sz); // minus the mask's top padding
  });
}
function moveLine(){
  const t=tabs[cur];
  line.style.width=t.offsetWidth+'px';
  line.style.transform=`translateX(${t.offsetLeft}px)`;
  tabs.forEach((b,i)=>b.setAttribute('aria-current',i===cur?'true':'false'));
  root.style.setProperty('--accent',F[cur].bg); // the CTA fills with the current flavour
}
function fit(){
  const W=innerWidth,H=innerHeight,mob=mqM.matches;
  u=Math.max(.05,mob?Math.min(W/640,(H-200)/620):Math.min(W/1440,H/900));
  root.style.setProperty('--u',u+'px');
  root.style.setProperty('--fy',mob?'8px':'0px');
  sizeWords(); sizeHand(); moveLine();
}

/* ---------- flavour words: the letter drop ---------- */
// each word sits in a mask; leaving, its letters drop down out of it one after another, left first;
// arriving, the new word's letters drop in from above in the same order
const letters=i=>[...slides[i].querySelectorAll('.l')];
const LETTER_GAP=45;
function wordOut(i,delay){
  if(mqR.matches)return;
  letters(i).forEach((el,n)=>{
    el.getAnimations().forEach(a=>a.cancel());
    el.animate([{transform:'translateY(0)'},{transform:'translateY(140%)'}],{duration:520,delay:delay+n*LETTER_GAP,easing:'cubic-bezier(.55,0,.85,.3)',fill:'forwards'});
  });
}
function wordIn(i,delay){
  if(mqR.matches)return;
  letters(i).forEach((el,n)=>{
    el.getAnimations().forEach(a=>a.cancel());
    el.animate([{transform:'translateY(-140%)'},{transform:'translateY(0)'}],{duration:820,delay:delay+n*LETTER_GAP,easing:'cubic-bezier(.2,.85,.25,1)',fill:'backwards'});
  });
}

/* ---------- interface motion ---------- */
// letter roll: every pill label becomes two stacked copies per letter that roll up on hover
document.querySelectorAll('.ui .pill:not(.arr)').forEach(el=>{
  const holder=el.querySelector('.roll')||el, text=holder.dataset.roll||el.textContent.trim();
  const html=`<span class="roll" aria-hidden="true">${[...text].map((ch,i)=>{const c=ch===' '?'&nbsp;':esc(ch);return `<span class="rc" style="--i:${i}"><span>${c}</span><span>${c}</span></span>`;}).join('')}</span>`;
  if(holder===el){el.setAttribute('aria-label',text);el.innerHTML=html;}
  else holder.outerHTML=html;
});
// Order now: the flavour-colour fill grows from where the pointer enters and shrinks back to where it leaves
const shopBtn=document.querySelector('.shop');
const setFill=e=>{const r=shopBtn.getBoundingClientRect();
  shopBtn.style.setProperty('--fx',(e.clientX-r.left)+'px');shopBtn.style.setProperty('--fy',(e.clientY-r.top)+'px');
  shopBtn.style.setProperty('--fd',Math.hypot(r.width,r.height)*2.1+'px');};
shopBtn.addEventListener('pointerenter',e=>{setFill(e);shopBtn.classList.add('is-hot');});
shopBtn.addEventListener('pointerleave',e=>{setFill(e);shopBtn.classList.remove('is-hot');});
shopBtn.addEventListener('focus',()=>shopBtn.classList.add('is-hot'));
shopBtn.addEventListener('blur',()=>shopBtn.classList.remove('is-hot'));
// a light sweep across the CTA each time a flavour lands
function shine(){if(mqR.matches)return;shopBtn.classList.remove('shine');void shopBtn.offsetWidth;shopBtn.classList.add('shine');}
shopBtn.addEventListener('animationend',()=>shopBtn.classList.remove('shine'));
// magnetic pull on the CTA and the arrows, mouse only
const magnets=[...document.querySelectorAll('.shop,.arr')];
addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'||mqR.matches)return;
  magnets.forEach(el=>{
    const r=el.getBoundingClientRect(), mx=parseFloat(el.style.getPropertyValue('--mx'))||0, my=parseFloat(el.style.getPropertyValue('--my'))||0;
    const cx=r.left+r.width/2-mx, cy=r.top+r.height/2-my, dx=e.clientX-cx, dy=e.clientY-cy;
    const reach=Math.max(r.width,r.height)*.5+70, d=Math.hypot(dx,dy);
    const k=d<reach?(el===shopBtn?.32:.4):0;
    el.style.setProperty('--mx',(dx*k).toFixed(1)+'px'); el.style.setProperty('--my',(dy*k).toFixed(1)+'px');
  });
});
document.addEventListener('pointerleave',()=>magnets.forEach(el=>{el.style.setProperty('--mx','0px');el.style.setProperty('--my','0px');}));

/* ---------- floating fruit: drops in from the top, flies back up on the way out ---------- */
// uses the separate translate property so the mirror (transform) and the bob (inner element) are untouched
const floaters=i=>[...slides[i].querySelectorAll('.fruit .p,.corner .p')];
function fruitOut(i,delay){
  if(mqR.matches)return;
  floaters(i).forEach((el,n)=>{
    el.getAnimations().forEach(a=>a.cancel());
    const up=el.getBoundingClientRect().bottom+60;
    el.animate([{translate:'0 0'},{translate:`0 ${-up}px`}],{duration:620+(n%3)*70,delay:delay+((n*37)%5)*45,easing:'cubic-bezier(.55,0,.9,.35)',fill:'forwards'});
  });
}
function fruitIn(i,delay){
  if(mqR.matches)return;
  floaters(i).forEach((el,n)=>{
    el.getAnimations().forEach(a=>a.cancel());
    const up=el.getBoundingClientRect().bottom+60;
    el.animate([{translate:`0 ${-up}px`},{translate:'0 0'}],{duration:950+(n%3)*90,delay:delay+((n*53)%5)*60,easing:'cubic-bezier(.2,.8,.25,1)',fill:'backwards'});
  });
}

/* ---------- flavour change ---------- */
// outgoing: the splash rewinds into the cup, then the hand sinks out of view;
// the wipe starts as it sinks, and the next hand rises from below and bursts
function startRewind(from){
  const c=clips[from], v=c.fw, rv=c.rv, N=CLIP.frames;
  const frame=t=>Math.min(N-1,Math.max(0,Math.floor(t*CLIP.fps+1e-4)));
  const fNow=frame(v.currentTime), fStart=frame(c.start);
  const span=Math.max(0,v.currentTime-c.start);
  v.pause();
  if(c.revFailed||rv.readyState<1||span<.1)return 0;
  exitIdx=from; revReady=false;
  revEnd=(N-1-fStart)/CLIP.fps;
  rv.pause();
  try{rv.currentTime=(N-1-fNow)/CLIP.fps+.002;}catch(e){exitIdx=-1;return 0;}
  return span/REWIND_RATE*1000+60;
}
// the outgoing flavour is cut away along a liquid edge: two sine waves that flow down the edge,
// swelling mid-sweep and flattening out at both ends
const WIPE=1150; // ms for the liquid sweep
const waveEase=t=>{t=clamp(t);return t<.5?4*t*t*t:1-(-2*t+2)**3/2;}; // even ease in and out, so the wave stays readable
function waveClip(c,dir,now){
  const W=innerWidth, H=innerHeight, amp=Math.sqrt(Math.sin(Math.PI*clamp(c)))*Math.min(130,W*.08), ph=now/240, N=40, pts=[];
  for(let i=0;i<=N;i++){
    const y=H*i/N, k=y/H;
    const off=amp*(Math.sin(k*Math.PI*2.4+ph)*.72+Math.sin(k*Math.PI*5.3-ph*1.35)*.28);
    const x=(dir>0?(1-c)*W:c*W)+off;
    pts.push(`${x.toFixed(1)}px ${y.toFixed(1)}px`);
  }
  return dir>0?`polygon(-200px -10px,${pts.join(',')},-200px ${H+10}px)`:`polygon(${W+200}px -10px,${pts.join(',')},${W+200}px ${H+10}px)`;
}
function go(to,dir){
  if(busy||to===cur)return;
  const from=cur,A=slides[from],B=slides[to];
  if(mqR.matches){cur=to;moveLine();enterHand();A.classList.remove('on');B.classList.add('on');landHand();return;}
  busy=true; clearTimeout(splashTimer);
  const rewind=startRewind(from);
  cur=to; moveLine(); enterHand(); playWater(to);
  B.style.visibility='visible'; B.style.zIndex='1';
  const LA=layers(A),LB=layers(B),handA=LA[2],t0=performance.now();
  const dropAt=Math.max(0,rewind-420), DROP=700, wipeAt=dropAt+180;
  const eic=x=>x*x*x;
  wordOut(from,Math.max(0,dropAt-120)); fruitOut(from,Math.max(0,dropAt-160));
  wordIn(to,wipeAt+.5*WIPE); fruitIn(to,wipeAt+.42*WIPE);
  let played=false;
  const step=now=>{
    const e=now-t0, d=clamp((e-dropAt)/DROP);
    const t=Math.max(0,(e-wipeAt)/WIPE), c=waveEase(t), k=eoq(clamp((t-.5)/.42)), hk=1-(1-clamp((t-.3)/.7))**3, FW=1440*u;
    handA.style.transform=`translate3d(0,${eic(d)*dropY()}px,0)`;
    A.style.clipPath=waveClip(c,dir,now);
    // the new hand rises from below the screen and lands as the wipe finishes
    if(!played&&t>=.3+SPLASH_DELAY/WIPE){played=true;landHand();} // splash plays shortly after the hand starts rising
    LB[2].style.transform=`translate3d(0,${(1-hk)*dropY()}px,0)`;
    if(t<1||k<1||hk<1||d<1){requestAnimationFrame(step);return;}
    A.classList.remove('on'); B.classList.add('on');
    [A,B].forEach(s=>{s.style.clipPath='';s.style.visibility='';s.style.zIndex='';});
    [...LA,...LB].forEach(l=>l.style.transform='');
    if(exitIdx>=0)clips[exitIdx].rv.pause(); exitIdx=-1; waters[from].pause();
    busy=false;
    if(!played)landHand();
  };
  requestAnimationFrame(step);
}
const next=()=>go((cur+1)%F.length,1);
const prev=()=>go((cur+F.length-1)%F.length,-1);
const act=()=>{lastAct=Date.now();};

tabs.forEach((b,i)=>b.addEventListener('click',()=>{act();if(!busy&&i!==cur)go(i,i>cur?1:-1);}));
document.querySelector('.next').addEventListener('click',()=>{act();next();});
document.querySelector('.prev').addEventListener('click',()=>{act();prev();});
document.querySelectorAll('.ui a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();act();}));
addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){act();next();}
  else if(e.key==='ArrowLeft'){act();prev();}
});
let sx=null,sy=0;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;});
addEventListener('pointerup',e=>{
  if(sx===null)return;
  const dx=e.clientX-sx,dy=e.clientY-sy; sx=null;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){act(); dx<0?next():prev();}
});
addEventListener('pointercancel',()=>{sx=null;});
// autoplay: each flavour moves on the moment its splash ends (finishSplash); this catches what that
// can't: a tab that was hidden at the time, reduced motion (a held still), or a video that failed
setInterval(()=>{
  if(document.hidden||!revealed||busy)return;
  const still=mqR.matches||clips[cur].failed;
  if(still&&Date.now()-lastAct<=6000)return;
  const done=ended&&Date.now()-ended>(still?2400:0), stuck=Date.now()-entered>15000;
  if(done||stuck)next();
},2600);

addEventListener('resize',fit);
mqM.addEventListener?.('change',fit);

/* ---------- opening ---------- */
const rise=[...document.querySelectorAll('.rise')];
function reveal(){
  if(revealed)return; revealed=true;
  fit(); enterHand();
  document.body.classList.remove('boot');
  if(mqR.matches){rise.forEach(e=>e.classList.remove('rise'));landHand();return;}
  const FW=1440*u;
  layers(slides[0]).forEach((l,j)=>{
    if(j===2){ // the hand rises from below and bursts on the way up
      l.animate([{transform:`translateY(${dropY()}px)`},{transform:'translateY(0)'}],{duration:1150,easing:EZ});
      splashTimer=setTimeout(landHand,SPLASH_DELAY); // splash plays shortly after the hand starts rising
    }else if(j===0)wordIn(0,120); // the first word drops in letter by letter
    else if(j===3)fruitIn(0,200);  // and the fruit drops in from the top
  });
  rise.forEach((e,i)=>{
    const a=e.animate([{opacity:0,translate:'0 14px'},{opacity:1,translate:'0 0'}],{duration:1000,delay:250+i*80,easing:EZ,fill:'both'});
    a.onfinish=()=>{e.classList.remove('rise');a.cancel();};
  });
}
setTimeout(()=>{
  if(!revealed)reveal();
  setTimeout(()=>rise.forEach(e=>{e.getAnimations().forEach(a=>a.finish());e.classList.remove('rise');}),1700);
},3000);

fit();
line.style.transition='none'; moveLine(); line.offsetWidth; line.style.transition='';
const faces=['700 100px Poppins','500 16px Unbounded','800 51px "Baloo 2"'];
const fontsReady=document.fonts?Promise.all(faces.map(f=>document.fonts.load(f))).then(()=>document.fonts.ready):Promise.resolve();
Promise.all([fontsReady.catch(()=>{}),videoReady])
  .then(()=>{line.style.transition='none';fit();line.offsetWidth;line.style.transition='';reveal();});
}
</script>
</body>
</html>
